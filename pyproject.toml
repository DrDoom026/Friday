[project]
name = "firday"
version = "0.5.0"
# Must match the Dockerfile's base image. tests/test_python_version.py enforces
# this: local and deployed interpreters differing is how a 3.12-only crash
# shipped green from a 3.14 venv in Part 5.
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
