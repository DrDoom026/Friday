services:
  api:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Overrides whatever .env says. Inside the container ~ expands to /root,
      # which the sandbox refuses as a protected system path - so the container
      # side of the mount below must be absolute and outside /root.
      FS_ALLOWED_ROOTS: /data/workspace
      # PART 8: the Obsidian vault - a second allowed root, separate from the
      # workspace. Syncthing keeps it mirrored to laptop/phone outside FIRDAY.
      FS_VAULT_ROOT: /data/vault
    volumes:
      # Persist the sandbox on the host, not in the container's writable layer.
      # FS_HOST_ROOT overrides the host side; it defaults to ~/firday/workspace.
      - "${FS_HOST_ROOT:-${HOME}/firday/workspace}:/data/workspace"
      # PART 8: the memory vault. FS_VAULT_HOST_ROOT overrides the host side;
      # it defaults to ~/firday/vault, the same directory Syncthing watches.
      - "${FS_VAULT_HOST_ROOT:-${HOME}/firday/vault}:/data/vault"
      # PART 5: device trust is anchored on Tailscale identity, so the container
      # needs to reach the host's tailscaled. Both mounts are read-only, and
      # both are optional - without them FIRDAY degrades to leaving devices
      # unverified rather than falling back to any token check.
      - "/var/run/tailscale:/var/run/tailscale:ro"
      - "/usr/bin/tailscale:/usr/bin/tailscale:ro"
      # PART 6: the docker.* tools read the engine's API over this socket. Like
      # the Tailscale mounts it is optional - without it those four tools report
      # Docker as unreachable and everything else is unaffected.
      #
      # Note what :ro does and does not do. It is the honest declaration of
      # intent, but a unix socket is not made read-only by the mount: anything
      # that can reach the Docker API can control the daemon. What actually
      # keeps FIRDAY read-only here is DockerClient, which implements no write
      # verb at all, and the fact that docker.start/stop/restart refuse.
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: unless-stopped
